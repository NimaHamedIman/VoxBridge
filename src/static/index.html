<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoxBridge — Sprachassistent</title>
    <link rel="icon" href="/static/icon.svg?v=0.6.0" type="image/svg+xml">
    <meta name="description" content="Sprachassistent mit lokaler Whisper-Transkription und LLaMA 3.3 — selbst gehostet auf einem eigenen Server.">
    <meta property="og:title" content="VoxBridge — Sprachassistent">
    <meta property="og:description" content="Sprachassistent mit lokaler Whisper-Transkription und LLaMA 3.3 — selbst gehostet auf einem eigenen Server.">
    <meta property="og:image" content="https://voice.nimaserver.xyz/static/og.png?v=0.6.0">
    <meta property="og:url" content="https://voice.nimaserver.xyz">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Bump ?v= on every deploy: Cloudflare caches these assets at the edge. -->
    <link rel="stylesheet" href="/static/style.css?v=0.6.0">
</head>
<body>

<div id="welcome" class="welcome" hidden>
    <div class="welcome-card">
        <h2>Bevor wir anfangen</h2>
        <label for="your-name">Wie soll ich dich nennen?</label>
        <input type="text" id="your-name" maxlength="40" autocomplete="off">
        <label for="bot-name">Und wie soll ich heißen?</label>
        <input type="text" id="bot-name" maxlength="40" autocomplete="off"
               placeholder="VoxBridge">
        <button id="welcome-done" class="send-wide">Los geht's</button>
    </div>
</div>

<header class="topbar">
    <span class="mark">VoxBridge</span>
    <span id="lang-badge" class="lang" title="Namen ändern" role="button" tabindex="0">DE</span>
</header>

<main class="stage">
    <canvas id="orb" aria-hidden="true"></canvas>

    <p id="status" class="status">Bereit</p>

    <p id="transcript" class="transcript" aria-live="polite"></p>
</main>

<footer class="controls">
    <button id="mic" class="mic" aria-label="Aufnahme starten">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"
                  fill="currentColor"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"
                  fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round"/>
        </svg>
    </button>

    <div class="compose">
        <input type="text" id="message" autocomplete="off"
               placeholder="… oder tippen" aria-label="Nachricht schreiben">
        <button id="send" class="send" aria-label="Nachricht senden">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 12h14M13 6l6 6-6 6" fill="none"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <!-- The pipeline is the actual architecture, not decoration.
         Each stage lights up while it is running. -->
    <ol class="pipeline" aria-label="Verarbeitungsschritte">
        <li data-stage="record">Mikrofon</li>
        <li data-stage="stt">Whisper</li>
        <li data-stage="llm">LLaMA&nbsp;3.3</li>
        <li data-stage="tts">Stimme</li>
    </ol>
</footer>

<!-- Bump ?v= on every deploy: Cloudflare caches these assets at the edge. -->
<script src="/static/orb.js?v=0.6.0"></script>
<script src="/static/app.js?v=0.6.0"></script>

</body>
</html>
